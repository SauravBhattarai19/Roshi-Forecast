# Live flood forecast for the Roshi Khola (Kavre). First places from the Sept 2024
# flood reports, placed on OpenStreetMap: correct them after 'roshi-forecast check'.
name: Roshi Khola flood forecast
model: model.yaml
display_timezone: Asia/Kathmandu
every_minutes: 30
forecast_hours: 72            # the Oct 30–31 storm is 2–3 days out
look_back_hours: 12
warm_up_days: 30
missing_rain: forecast_model
station_silent_minutes: 60    # RTS has each 10-minute reading within about 10 minutes
threads_per_run: 8

# No rain stations here: the three AWS (Roshi 468, Nala 469, Parkhalchour 470) all sit in
# the 158 km² above the Panauti gauge, a quarter of this 563 km² basin, so they cannot
# stand for all of it. The rain before now is the main forecast model's own (ECMWF).
# The part above the gauge runs on the stations as its own place: places/panauti.
rain_stations: []

rain_forecasts:
  - {name: ECMWF, source: open_meteo, model: ecmwf_ifs025}
  - {name: GFS,   source: open_meteo, model: gfs_seamless}
  - {name: ICON,  source: open_meteo, model: icon_seamless}
  - {name: alertnepal, source: alertnepal_forecast}
main_forecast: ECMWF
no_rain_version: true

inflows: []                    # a headwater basin

hydrograph_points:             # warning levels: set from the 2024 rehearsal
  - {name: Panauti, lat: 27.58491, lon: 85.52141, warning_m3s: 150, danger_m3s: 300}               # below the Punyamati, near DHM 640
  - {name: Panauti gauge (RTS 471), lat: 27.56998, lon: 85.53894, snap_radius_cells: 3}            # 2.3 km below Panauti; 3 cells north of the river line
  - {name: Khopasi, lat: 27.56193, lon: 85.53829, warning_m3s: 200, danger_m3s: 400}
  - {name: Mangaltar (BP Highway), lat: 27.47640, lon: 85.74547, warning_m3s: 600, danger_m3s: 1200}

river_gauges:                  # measured water level, drawn under the point's hydrograph
  - {name: Roshi Khola at Panauti, source: rts, station: 471, point: Panauti gauge (RTS 471)}

flood_areas:
  - {name: Panauti town, box: [85.505, 27.574, 85.532, 27.592], method: 2d}
  - {name: Mangaltar (BP Highway), box: [85.725, 27.465, 85.762, 27.487], method: 2d}

# The whole basin in 2D at 30 m (FABDEM), drawn as overlapping boxes side by side
basin_map: {method: 2d, boxes: auto}

website:
  title: Roshi Khola flood forecast (experimental)
  notice: Run as a research test of MRRpy. The warning and danger levels are placeholders for testing, not real levels.
